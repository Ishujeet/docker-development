services:
  dev:
    build:
      context: .
      args:
        # Match these to your host user so files created in mounted folders
        # are owned by you, not root. Find yours with: id -u  /  id -g
        USERNAME: dev
        USER_UID: "1000"
        USER_GID: "1000"
        # Pinned tool versions -- bump to upgrade. Keeping them explicit here means
        # a rebuild only re-runs the layer whose version changed (see Dockerfile).
        PYTHON_FORMULA: "python@3.12"
        NODE_VERSION: "22"
        OHMYZSH_REF: "master"     # pin to a commit SHA for full reproducibility
        CLAUDE_VERSION: "stable"  # or "latest" / an exact "X.Y.Z"
        PLAYWRIGHT_VERSION: "latest"  # pin to an exact "X.Y.Z" to lock the Chromium build
    image: brew-dev:latest
    container_name: brew-dev
    working_dir: /workspace
    # Keep the container alive so you can `exec` a shell into it whenever.
    command: sleep infinity
    tty: true
    stdin_open: true
    # Lightweight hardening: stop processes from gaining extra privileges.
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # Your project / local folders. Edit the left side to point at whatever you want.
      # Tip: share only the folder you're working in, not your whole home directory.
      - ./:/workspace
      # - /absolute/path/on/host:/workspace/another-folder

      # Editable + persistent zsh config: edit ./zshrc on your host, it shows up here.
      - ./zshrc:/home/dev/.zshrc

      # Persist auth/config across container rebuilds.
      # NOTE: the right-hand paths assume USERNAME=dev above. Change if you change USERNAME.
      - claude-config:/home/dev/.claude
      - azure-config:/home/dev/.azure
      - kube-config:/home/dev/.kube

      # Persist the Playwright-managed Chromium across rebuilds. A fresh (empty)
      # named volume is seeded from the browser baked into the image at build
      # time, so the first `up` already has it; later rebuilds reuse the volume.
      - ms-playwright:/home/dev/.cache/ms-playwright

volumes:
  claude-config:
  azure-config:
  kube-config:
  ms-playwright: